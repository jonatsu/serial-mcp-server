version: 2
updates:
  # The workflows pin actions to commit SHAs; this keeps those SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # uv.lock. A ruff update must also change the ruff-pre-commit rev in .pre-commit-config.yaml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
