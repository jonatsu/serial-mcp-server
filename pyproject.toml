[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "serial-mcp-server"
dynamic = ["version"]
description = "Serial port Model Context Protocol server for AI agents and developer tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Enrico Santagati"},
]
dependencies = [
    "pyserial>=3.5,<4",
    "mcp>=1.30.0,<2",
    "pyyaml>=6.0,<7",
    "pydantic-settings>=2.7,<3",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/jonatsu/serial-mcp-server"
Repository = "https://github.com/jonatsu/serial-mcp-server"
Issues = "https://github.com/jonatsu/serial-mcp-server/issues"
Changelog = "https://github.com/jonatsu/serial-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
serial_mcp = "serial_mcp_server.server:main"
serial_mcp_script = "serial_mcp_server.script_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["serial_mcp_server"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "serial_mcp_server"

# Layers of docs/plans/package-layout-design.md section 5.2. Each package refactor unit extends these
# contracts; the final unit replaces them with one layers contract.
[[tool.importlinter.contracts]]
name = "port/ imports nothing from the script engine or the MCP server"
type = "forbidden"
source_modules = ["serial_mcp_server.port"]
forbidden_modules = [
    "serial_mcp_server.script",
    "serial_mcp_server.state",
    "serial_mcp_server.server",
    "serial_mcp_server.helpers",
    "serial_mcp_server.script_cli",
    "serial_mcp_server.handlers_file",
    "serial_mcp_server.handlers_introspection",
    "serial_mcp_server.handlers_log",
    "serial_mcp_server.handlers_plugin",
    "serial_mcp_server.handlers_script",
    "serial_mcp_server.handlers_serial",
    "serial_mcp_server.handlers_spec",
    "serial_mcp_server.handlers_trace",
]

[[tool.importlinter.contracts]]
name = "portlog/ imports nothing from port/, the script engine, or the MCP server"
type = "forbidden"
source_modules = ["serial_mcp_server.portlog"]
forbidden_modules = [
    "serial_mcp_server.port",
    "serial_mcp_server.script",
    "serial_mcp_server.state",
    "serial_mcp_server.server",
    "serial_mcp_server.helpers",
    "serial_mcp_server.script_cli",
    "serial_mcp_server.handlers_file",
    "serial_mcp_server.handlers_introspection",
    "serial_mcp_server.handlers_log",
    "serial_mcp_server.handlers_plugin",
    "serial_mcp_server.handlers_script",
    "serial_mcp_server.handlers_serial",
    "serial_mcp_server.handlers_spec",
    "serial_mcp_server.handlers_trace",
]

[[tool.importlinter.contracts]]
name = "script/ imports nothing from the MCP server or the command-line runner"
type = "forbidden"
source_modules = ["serial_mcp_server.script"]
forbidden_modules = [
    "serial_mcp_server.state",
    "serial_mcp_server.server",
    "serial_mcp_server.helpers",
    "serial_mcp_server.script_cli",
    "serial_mcp_server.handlers_file",
    "serial_mcp_server.handlers_introspection",
    "serial_mcp_server.handlers_log",
    "serial_mcp_server.handlers_plugin",
    "serial_mcp_server.handlers_script",
    "serial_mcp_server.handlers_serial",
    "serial_mcp_server.handlers_spec",
    "serial_mcp_server.handlers_trace",
]

[[tool.importlinter.contracts]]
name = "specs/ imports nothing from the port, the script engine, or the MCP server"
type = "forbidden"
source_modules = ["serial_mcp_server.specs"]
forbidden_modules = [
    "serial_mcp_server.port",
    "serial_mcp_server.portlog",
    "serial_mcp_server.script",
    "serial_mcp_server.state",
    "serial_mcp_server.server",
    "serial_mcp_server.helpers",
    "serial_mcp_server.script_cli",
    "serial_mcp_server.handlers_file",
    "serial_mcp_server.handlers_introspection",
    "serial_mcp_server.handlers_log",
    "serial_mcp_server.handlers_plugin",
    "serial_mcp_server.handlers_script",
    "serial_mcp_server.handlers_serial",
    "serial_mcp_server.handlers_spec",
    "serial_mcp_server.handlers_trace",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["*.md"]  # Ruff 0.16 reformats Python code fences in Markdown; the docs keep their own layout

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "S110",    # try-except-pass is intentional for best-effort serial cleanup
    "SIM105",  # contextlib.suppress is less readable for async cleanup
    "RUF001",  # en-dash in strings is intentional
    "RUF002",  # en-dash in docstrings is intentional
    "RUF003",  # en-dash in comments is intentional
    "RUF006",  # fire-and-forget create_task is intentional in signal handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "RUF059"]  # asserts, /tmp paths, unused unpacked vars are fine in tests
"tools/*" = ["S603", "S607"]  # subprocess calls in CLI tools use controlled input
"examples/*" = ["S105", "S311", "S603", "S607"]  # demo devices: fake passwords, pseudo-random sensor data, subprocess
"tests/integration/*" = ["S105", "S603", "S607"]  # end-to-end harness: fake token env name and script password, subprocess calls with fixed argv

[tool.ruff.lint.isort]
known-first-party = ["serial_mcp_server"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "serial_mcp_server/_version.py"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B110"]  # try-except-pass is intentional for best-effort serial cleanup
