[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "serial-mcp-server"
dynamic = ["version"]
description = "Serial port Model Context Protocol server for AI agents and developer tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Enrico Santagati"},
]
dependencies = [
    "anyio>=4.11,<5",
    "pyserial>=3.5,<4",
    "mcp>=1.30.0,<2",
    "pyyaml>=6.0,<7",
    "pydantic-settings>=2.7,<3",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/jonatsu/serial-mcp-server"
Repository = "https://github.com/jonatsu/serial-mcp-server"
Issues = "https://github.com/jonatsu/serial-mcp-server/issues"
Changelog = "https://github.com/jonatsu/serial-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
serial_mcp = "serial_mcp_server.mcp.server:main"
serial_mcp_script = "serial_mcp_server.cli:main"

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["serial_mcp_server"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "serial_mcp_server"

# The layers of docs/plans/package-layout-design.md section 5.2, top first. A module may import from its own layer
# and the layers below it; a layer whose modules are joined by ":" lets them import each other.
[[tool.importlinter.contracts]]
name = "every module imports only from its own layer and the layers below"
type = "layers"
layers = [
    "serial_mcp_server.plugin_api",
    "serial_mcp_server.mcp : serial_mcp_server.cli",
    "serial_mcp_server.script : serial_mcp_server.specs",
    "serial_mcp_server.port",
    "serial_mcp_server.portlog",
    "serial_mcp_server.config : serial_mcp_server.confined_files : serial_mcp_server.private_files",
]

[[tool.importlinter.contracts]]
name = "the command-line runner and the plugin interface do not import each other"
type = "independence"
modules = ["serial_mcp_server.cli", "serial_mcp_server.plugin_api"]

[[tool.importlinter.contracts]]
name = "the command-line runner imports nothing from the MCP server"
type = "forbidden"
source_modules = ["serial_mcp_server.cli"]
forbidden_modules = ["serial_mcp_server.mcp"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["*.md"]  # Ruff 0.16 reformats Python code fences in Markdown; the docs keep their own layout

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "S110",    # try-except-pass is intentional for best-effort serial cleanup
    "SIM105",  # contextlib.suppress is less readable for async cleanup
    "RUF001",  # en-dash in strings is intentional
    "RUF002",  # en-dash in docstrings is intentional
    "RUF003",  # en-dash in comments is intentional
    "RUF006",  # fire-and-forget create_task is intentional in signal handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "RUF059"]  # asserts, /tmp paths, unused unpacked vars are fine in tests
"tools/*" = ["S603", "S607"]  # subprocess calls in CLI tools use controlled input
"examples/*" = ["S105", "S311", "S603", "S607"]  # demo devices: fake passwords, pseudo-random sensor data, subprocess
"tests/integration/*" = ["S105", "S603", "S607"]  # end-to-end harness: fake token env name and script password, subprocess calls with fixed argv

[tool.ruff.lint.isort]
known-first-party = ["serial_mcp_server"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "serial_mcp_server/_version.py"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B110"]  # try-except-pass is intentional for best-effort serial cleanup
