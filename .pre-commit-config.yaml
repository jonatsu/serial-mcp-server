---
# Pre-commit hooks: https://pre-commit.com
# Install once with `pre-commit install`; run on demand with `pre-commit run --files <paths>`.
#
# Each formatter is the only writer for its files, and every checker is report-only, so no two hooks can fight:
# Ruff writes Python, mdformat writes Markdown, and markdownlint-cli2 only reports. Tool options live in each
# tool's own configuration file (pyproject.toml, .mdformat.toml, .markdownlint-cli2.jsonc, .editorconfig), which
# editors read too, rather than in hook arguments.

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

repos:
  # Generic hygiene: https://github.com/pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: trailing-whitespace
        # Keep two-space hard breaks in Markdown for mdformat, which rewrites them as backslash breaks.
        args: ["--markdown-linebreak-ext=md,mkd,mkdn,markdown,mdx"]

  # Secrets in the staged diff only; this does not scan history: https://github.com/betterleaks/betterleaks
  # The `betterleaks` id builds the Go binary; `betterleaks-system` uses an installed one.
  - repo: https://github.com/betterleaks/betterleaks
    rev: "v1.9.0"  # newest stable; autoupdate picks the v2 release candidate
    hooks:
      - id: betterleaks

  # EditorConfig compliance: https://github.com/editorconfig-checker/editorconfig-checker.python
  # .editorconfig-checker.json turns off its indent-size check: Ruff owns Python indentation and mdformat owns
  # Markdown's, and the checker cannot tell a Markdown template inside a Python string from code.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.11.1"
    hooks:
      - id: editorconfig-checker

  # Python lint and format: https://docs.astral.sh/ruff/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.0"
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The only Markdown writer: https://mdformat.readthedocs.io/en/stable/
  - repo: https://github.com/hukkin/mdformat
    rev: "1.0.0"
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-footnote==0.1.3
          - mdformat-frontmatter==2.1.2
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-simple-breaks==0.1.0
          - mdformat-config==0.2.1

  # Markdown lint, report only: https://github.com/DavidAnson/markdownlint-cli2
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: "v0.23.3"
    hooks:
      - id: markdownlint-cli2

  # A non-breaking space (U+00A0) is not whitespace to a Markdown parser, so a nested item or fence indented with
  # one silently leaves its parent block, and neither Markdown hook above reports it. Report only. The entry is a
  # bytes regex, so the UTF-8 sequence is written out with alternation rather than a character class, which would
  # match each byte alone (and fire on characters such as `à`). Only leading whitespace is checked, because a
  # mid-line U+00A0 is legitimate typography.
  - repo: local
    hooks:
      - id: markdown-nbsp-indent
        name: no non-breaking space in Markdown indentation
        language: pygrep
        entry: '^(?:[ \t]|\xc2\xa0)*\xc2\xa0'
        types_or: [markdown, mdx]
